<!-- 파일 경로: /pages/mental-math.html -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>암산연습</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  />
</head>

<body>

  <!-- ================================
       공통 상단 메뉴
  ================================ -->

  <header
    id="site-header"
    class="site-header"
  ></header>


  <!-- ================================
       메인 콘텐츠
  ================================ -->

  <main>

    <!-- ================================
         암산연습 소개
    ================================ -->

    <section
      class="card content-section mental-math-section"
    >

      <div class="section-heading">

        <p class="hero-label">
          MENTAL MATH
        </p>

        <h1>
          암산연습
        </h1>

        <p>
          빠르고 정확하게 문제를 풀어보세요!
        </p>

      </div>


      <!-- ================================
           게임 상태
      ================================ -->

      <div
        class="mental-math-status"
      >

        <div
          class="mental-math-status-item"
        >

          <span>
            문제
          </span>

          <strong
            id="mental-math-question-number"
          >
            0
          </strong>

        </div>


        <div
          class="mental-math-status-item"
        >

          <span>
            정답
          </span>

          <strong
            id="mental-math-correct-count"
          >
            0
          </strong>

        </div>


        <div
          class="mental-math-status-item"
        >

          <span>
            점수
          </span>

          <strong
            id="mental-math-score"
          >
            0
          </strong>

        </div>

      </div>


      <!-- ================================
           문제 영역
      ================================ -->

      <div
        class="mental-math-question-card"
      >

        <p
          class="mental-math-question-label"
        >
          다음 문제의 답을 입력하세요
        </p>


        <div
          id="mental-math-question"
          class="mental-math-question"
        >
          시작 버튼을 눌러주세요
        </div>


        <!-- ================================
             답 입력
        ================================ -->

        <div
          class="mental-math-answer-area"
        >

          <label
            for="mental-math-answer"
            class="mental-math-answer-label"
          >
            정답
          </label>

          <input
            type="number"
            id="mental-math-answer"
            class="mental-math-answer-input"
            placeholder="답을 입력하세요"
            autocomplete="off"
            inputmode="numeric"
          />

          <button
            type="button"
            id="mental-math-submit-button"
            class="mental-math-button"
          >
            정답 확인
          </button>

        </div>


        <!-- ================================
             결과 표시
        ================================ -->

        <div
          id="mental-math-result"
          class="mental-math-result"
          aria-live="polite"
        >
          문제를 시작하면 결과가 표시됩니다.
        </div>


        <!-- ================================
             다음 문제
        ================================ -->

        <button
          type="button"
          id="mental-math-next-button"
          class="mental-math-button mental-math-next-button"
        >
          다음 문제
        </button>


        <!-- ================================
             게임 시작 / 재시작
        ================================ -->

        <button
          type="button"
          id="mental-math-start-button"
          class="mental-math-button mental-math-start-button"
        >
          암산연습 시작
        </button>

      </div>


      <!-- ================================
           게임 안내
      ================================ -->

      <div
        class="mental-math-info"
      >

        <h2>
          암산연습 방법
        </h2>

        <div
          class="mental-math-info-grid"
        >

          <div
            class="mental-math-info-card"
          >

            <span>
              1
            </span>

            <p>
              <strong>문제 풀기</strong><br />
              화면에 표시되는 계산 문제를 확인하세요.
            </p>

          </div>


          <div
            class="mental-math-info-card"
          >

            <span>
              2
            </span>

            <p>
              <strong>답 입력</strong><br />
              계산한 답을 입력하고 정답 확인을 누르세요.
            </p>

          </div>


          <div
            class="mental-math-info-card"
          >

            <span>
              3
            </span>

            <p>
              <strong>다음 문제</strong><br />
              결과를 확인한 후 다음 문제에 도전하세요.
            </p>

          </div>


          <div
            class="mental-math-info-card"
          >

            <span>
              4
            </span>

            <p>
              <strong>키보드 사용</strong><br />
              답을 입력한 뒤 Enter 키로 정답을 제출할 수 있습니다.
            </p>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- ================================
       공통 메뉴 및 암산연습 JavaScript
  ================================ -->

  <script
    src="../js/header.js"
  ></script>

  <script
    src="../js/mental-math.js"
  ></script>

</body>
</html>
